[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ostinato"
version = "0.0.1"
description = "Offline casualty assessment research prototype"
requires-python = ">=3.10,<3.13"
dependencies = [
    "mediapipe==0.10.21",
    "numpy>=1.24,<2",
    "opencv-contrib-python>=4.8,<4.12",
    "pillow>=10.1",
    "scipy>=1.11",
]

[project.scripts]
ostinato = "ostinato.app:main"
ostinato-sim = "ostinato.simulation:main"
ostinato-accuracy = "ostinato.accuracy:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
robot = ["pyserial>=3.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
