name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
# A new push to a pull request makes its older run pointless, so that run stops. On
# main, each commit has a group of its own, so every merge is tested: a shared group
# would drop runs still waiting to start, even without cancel-in-progress.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest
