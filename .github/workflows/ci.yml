name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/*.cjs
      - name: Stage the tested browser release
        run: python tools/build_site.py "${{ runner.temp }}/ostinato-site"
      - uses: actions/upload-artifact@v4
        with:
          name: ostinato-site
          path: ${{ runner.temp }}/ostinato-site/
          if-no-files-found: error
